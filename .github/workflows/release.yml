# Push a tag (git tag v1.1.0 && git push origin v1.1.0) to publish a release with one ZIP per
# skill. The ZIPs are what the Claude app's skill upload takes; README links point at
# releases/latest/download/<name>.zip.
name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false
      - run: node scripts/validate.mjs
      - name: Zip each skill
        run: |
          mkdir dist
          cd skills
          for d in */; do zip -qr "../dist/${d%/}.zip" "${d%/}"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.zip --title "$TAG" --generate-notes --verify-tag
